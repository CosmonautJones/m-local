name: Shared native onboarding proof

on:
  push:
    branches: [main, codex/release-readiness, 'release/**']
  pull_request:
    branches: [main, codex/release-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-native-onboarding-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-share:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Report tracked source-byte composition
        run: python3 scripts/check-jac-share.py
  shared-onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Jac
        run: bash scripts/setup.sh
      - name: Check the disposable TLS mail sink
        run: python3 -m unittest discover -s tests/integration -p test_smtp_sink.py
      - name: Verify shared onboarding over two native APIs
        run: bash scripts/test-shared-onboarding.sh
