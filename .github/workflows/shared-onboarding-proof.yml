name: Shared native onboarding proof

on:
  push:
    branches: [codex/release-readiness]
    paths:
      - '.github/workflows/shared-onboarding-proof.yml'
      - 'scripts/test-shared-onboarding.sh'
      - 'tests/integration/shared_onboarding_http.py'
      - 'tests/integration/smtp_sink.py'
      - 'tests/integration/test_smtp_sink.py'
      - 'tests/integration/recovery_http.py'
      - 'services/**'
      - 'main.jac'
      - 'jac.toml'
      - '.jac-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-native-onboarding-proof
  cancel-in-progress: false

jobs:
  shared-onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Report tracked source-byte composition
        run: python3 scripts/check-jac-share.py
      - name: Install pinned Jac
        run: bash scripts/setup.sh
      - name: Check the disposable TLS mail sink
        run: python3 -m unittest discover -s tests/integration -p test_smtp_sink.py
      - name: Verify shared onboarding over two native APIs
        run: bash scripts/test-shared-onboarding.sh
