name: Package input checks

on:
  workflow_dispatch:
  push:
    branches:
      - codex/runtime-verification
    paths:
      - '.gitattributes'
      - '.github/workflows/runtime-package-inputs.yml'
      - 'runtime-proof/**'

permissions:
  contents: read

jobs:
  package-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed package inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify predeclared runtime source inputs
        run: |
          echo 'eaf2dc65909aa593f322cf75cf239ab86fe9b5b79621d9b35d2b42af2ea83368  runtime-proof/check-runtime-direct-use.py' | sha256sum -c -
          python3 -I -B runtime-proof/check-runtime-direct-use.py --expected-commit "$GITHUB_SHA"
      - name: Check official cache provenance boundaries
        run: python3 -B runtime-proof/test-package-inputs.py
      - name: Check source and package commitment preflight
        run: python3 -I -B runtime-proof/test-package-preflight.py
      - name: Check authenticated source job origin boundaries
        run: python3 -I -B runtime-proof/test-source-origin.py
      - name: Check source archive download and extraction boundaries
        run: python3 -I -B runtime-proof/test-source-archive.py
      - name: Check runtime declaration and fresh fork boundaries
        run: python3 -I -B runtime-proof/test-runtime-direct-use.py
      - name: Check fresh package acceptance and cleanup boundaries
        run: sudo -n python3 -I -B runtime-proof/test-fresh-package.py
      - name: Check workload launcher binding and dropped identity
        run: sudo -n python3 -I -B runtime-proof/test-workload-launcher.py
      - name: Check source isolation and restoration on owned fixtures
        run: sudo -n python3 -I -B runtime-proof/test-source-isolation.py
      - name: Check private tracing client and tracee environment on owned fixtures
        run: sudo -n python3 -I -B runtime-proof/test-file-trace-control.py
      - name: Check private PostgreSQL client bindings on owned fixtures
        run: sudo -n python3 -I -B runtime-proof/test-pg-client-control.py
      - name: Check private JavaScript test-tool bindings on owned fixtures
        run: sudo -n python3 -I -B runtime-proof/test-node-client-control.py
      - name: Check prepared transaction matrix bindings on owned fixtures
        run: sudo -n python3 -I -B runtime-proof/test-prepared-runtime-matrix.py
      - name: Check browser-test dependency lock and integrity boundaries
        run: python3 -I -B runtime-proof/test-ui-dependency-lock.py
      - name: Check frozen browser-test dependency installation on owned fixtures
        run: sudo -n python3 -I -B runtime-proof/test-ui-dependency-consumer.py
      - name: Check native compatibility adaptation and orchestration boundaries
        run: sudo -n python3 -I -B runtime-proof/test-native-compatibility.py
      - name: Verify frozen browser-test dependency inputs without installing them
        run: |
          echo 'd47b342bea74d64fa3575673a07b90d5595fdabe0e87a93f714cc6d7caa7c635  runtime-proof/verify-package-preflight.py' | sha256sum -c -
          python3 -I -B - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import os
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('ui_input_preflight', root / 'runtime-proof/verify-package-preflight.py')
          preflight = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(preflight)
          commit = os.environ['GITHUB_SHA']
          preflight.checked_checkout(root, commit)
          helper = 'runtime-proof/generate-ui-dependency-lock.py'
          assert preflight.sha(preflight.committed_file(root, commit, helper)) == 'ca736a8bdf433efd8e5c49bad022c7da5d6598b87beabfd9e42e1c2215f649be'
          spec = importlib.util.spec_from_file_location('frozen_ui_lock', root / helper)
          lock = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lock)
          relative = 'runtime-proof/ui-dependency-inputs/v1/'
          expected = {
              'package.json': (128, 'f1e64f1c622aecd2ef34d348bb871f272c5ad8688e22a43c52d01bb339b2429c'),
              'package-lock.json': (17873, '0c775bf70def454618101b2d18ac8818beb6fbbf8245867adf5e38a65630567d'),
              'dependency-inputs.json': (17424, '03ff15b78906b2271a8dabc25a2c1a0cab40374ce0d7914b7f843811c95b37b5'),
          }
          files = {}
          for name, (length, digest) in expected.items():
              raw = preflight.committed_file(root, commit, relative + name)
              assert len(raw) == length and preflight.sha(raw) == digest
              files[name] = raw
          assert sorted(path.name for path in (root / relative).iterdir()) == sorted(expected)
          assert files['package.json'] == lock.PACKAGE_RAW
          rows = lock.parse_lock(files['package-lock.json'])
          receipt = lock._json(files['dependency-inputs.json'], 'dependency receipt')
          assert receipt['schema'] == 'm-local-ui-dependency-inputs-v1'
          assert receipt['status'] == 'generated_and_offline_verified' and receipt['evidence_scope'] == 'dependency_preparation_only'
          assert receipt['source_commit'] == '0b82936f2a8c408532eef98c29f234cb90f646a5'
          assert receipt['node_version'] == '22.16.0' and receipt['npm_version'] == '10.9.2'
          assert receipt['package_sha256'] == preflight.sha(files['package.json']) and receipt['lock_sha256'] == preflight.sha(files['package-lock.json'])
          assert type(receipt['uid']) is int and receipt['uid'] == 65534 and type(receipt['gid']) is int and receipt['gid'] == 65534
          assert receipt['supplementary_groups'] == [] and receipt['smoke'] == {'status': 'passed', 'ok': 1}
          assert len(rows) == len(receipt['tarballs']) == 39
          for row, tarball in zip(rows, receipt['tarballs']):
              assert {key: tarball[key] for key in row} == row
          print(json.dumps(dict(status='frozen_preparation_inputs', dependencies=39, application_tests_executed=False)))
          PY
      - name: Verify immutable native suite sources without executing them
        run: |
          echo 'd47b342bea74d64fa3575673a07b90d5595fdabe0e87a93f714cc6d7caa7c635  runtime-proof/verify-package-preflight.py' | sha256sum -c -
          python3 -I -B - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import os
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('native_input_preflight', root / 'runtime-proof/verify-package-preflight.py')
          preflight = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(preflight)
          commit = os.environ['GITHUB_SHA']
          preflight.checked_checkout(root, commit)
          relative = 'runtime-proof/native-inputs/native-suite-v5/'
          raw = preflight.committed_file(root, commit, relative + 'original-inputs.json')
          assert preflight.sha(raw) == '27d03f9e1d8eb17956789a7b84dbc8ce84bb222dec7644dbb18ce15672e6153f'
          manifest = json.loads(raw)
          assert manifest['status'] == 'frozen_not_executed' and manifest['adaptation_required'] is True
          assert len(manifest['sources']) == 9 and len(manifest['compatibility_phases']) == 24
          assert len(manifest['catalog_mutation_cases']) == 6 and manifest['source_interfaces'] == ['codec', 'controls']
          for row in manifest['sources']:
              item = preflight.committed_file(root, commit, relative + row['file'])
              assert len(item) == row['bytes'] and preflight.sha(item) == row['sha256']
          assert sorted(path.name for path in (root / relative).iterdir()) == sorted(['original-inputs.json'] + [row['file'] for row in manifest['sources']])
          print(json.dumps(dict(status='frozen_not_executed', source_files=9, compatibility_phases=24, executed=False)))
          PY
