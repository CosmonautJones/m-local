name: Package input checks

on:
  workflow_dispatch:
  push:
    branches:
      - codex/runtime-verification
    paths:
      - '.github/workflows/runtime-package-inputs.yml'
      - 'runtime-proof/package-inputs/**'
      - 'runtime-proof/test-package-inputs.py'
      - 'runtime-proof/verify-package-preflight.py'
      - 'runtime-proof/test-package-preflight.py'
      - 'runtime-proof/verify-source-origin.py'
      - 'runtime-proof/test-source-origin.py'
      - 'runtime-proof/download-source-handoff.py'
      - 'runtime-proof/test-source-archive.py'

permissions:
  contents: read

jobs:
  package-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed package inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Jac source-byte share
        run: python3 -B scripts/check-jac-share.py --min-jac 40
      - name: Check official cache provenance boundaries
        run: python3 -B runtime-proof/test-package-inputs.py
      - name: Check source and package commitment preflight
        run: python3 -I -B runtime-proof/test-package-preflight.py
      - name: Check authenticated source job origin boundaries
        run: python3 -I -B runtime-proof/test-source-origin.py
      - name: Check source archive download and extraction boundaries
        run: python3 -I -B runtime-proof/test-source-archive.py
