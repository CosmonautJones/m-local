name: Package input checks

on:
  workflow_dispatch:
  push:
    branches:
      - codex/runtime-verification
    paths:
      - '.github/workflows/runtime-package-inputs.yml'
      - 'runtime-proof/package-inputs/**'
      - 'runtime-proof/test-package-inputs.py'

permissions:
  contents: read

jobs:
  package-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed package inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Jac source-byte share
        run: python3 -B scripts/check-jac-share.py --min-jac 40
      - name: Check official cache provenance boundaries
        run: python3 -B runtime-proof/test-package-inputs.py
