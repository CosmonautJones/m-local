name: runtime runner control proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Jac source-byte share
        run: python3 scripts/check-jac-share.py --min-jac 40
      - name: Verify disposable ext4 and kernel workload controls
        shell: bash
        run: sudo -n timeout --signal=TERM --kill-after=45s 480s python3 -B runtime-proof/probe-runner-controls.py
