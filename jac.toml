[project]
name = "mobile-starter"
version = "0.0.1"
description = "Mobile app starter - one Jac source, iOS + Android + web"
entry-point = "main"
jac-version = "0.37.23"
kind = "web-app"

[client]

[serve]
host = "127.0.0.1"
docs_enabled = false
# Private redemption credentials must not be exposed by the graph inspector.
graph_enabled = false

[serve.limits]
# Per API process; leave PostgreSQL headroom for idle pools and operations.
max_connections = 96

[scale.admin]
enabled = false


[dependencies]
pillow = "==12.3.0"

# Install Jac's llm capability; website AI calls still require MLOCAL_IMPORT_MODEL.
[byllm.model]
default_model = "gpt-4o-mini"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
"qrcode.react" = "4.2.0"
"@zxing/browser" = "0.1.5"

[jacpack]
name = 'M-Local'
description = 'Jac IDE snapshot for M-Local'

[jachammer]
project_id = "prj_c0b45632e1d64a60bb45efbe7397a42d"
